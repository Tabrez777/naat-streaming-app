<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#CC0000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </radialGradient>
  </defs>
  <!-- Dark background circle -->
  <rect width="512" height="512" rx="96" fill="#0A0A0A"/>
  <!-- Red glowing circle -->
  <circle cx="256" cy="256" r="210" fill="url(#bg)"/>
  <!-- Letter T with integrated play button -->
  <g fill="#FFFEF2">
    <!-- T horizontal bar -->
    <rect x="120" y="130" width="200" height="45" rx="8"/>
    <!-- T vertical stem -->
    <rect x="195" y="130" width="48" height="220" rx="6"/>
    <!-- Play triangle merging from T stem -->
    <polygon points="243,235 350,305 243,375"/>
  </g>
</svg>